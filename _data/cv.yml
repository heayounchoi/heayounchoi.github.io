    Research Interests:
      - label: Generalization and Autonomous Adaptation
        details: Developing systems that leverage prior knowledge and limited new experience to adapt beyond training distributions and continuously acquire missing knowledge in novel environments.
      - label: Reasoning in the Physical World
        details: Combining learned representations with structured reasoning and physical constraints for more reliable decision-making in real-world settings.
